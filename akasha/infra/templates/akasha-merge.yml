# Akasha installs this file. It works on the pull requests with the label akasha-merge.
# merge: after the check akasha passes, or after an approval, it brings the pull request up to date when the default
#   branch moved, because GitHub does not do it. Where GitHub has no auto-merge, for example a private repository on
#   GitHub Free, it then merges the pull request when the code owners approved. When GitHub protects the default
#   branch, GitHub merges.
# failed: after the check akasha fails, it tells the holder of the task on the pull request and on the issue.
# The GitHub app of Akasha (the variable AKASHA_APP_CLIENT_ID and the secret AKASHA_APP_KEY) gives a token that starts
# other workflows, for example a deployment after a merge and the check after an update. Without the app, the secret
# AKASHA_TOKEN can give such a token. Without both, the merge starts no other workflow, and the pull requests do not
# come up to date.
name: akasha-merge
on:
  workflow_run:
    workflows: [akasha]
    types: [completed]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
      && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: akasha-merge                           # one at a time: no other merge between the comparison and the merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Make a token of the GitHub app of Akasha
        id: app
        if: ${{ vars.AKASHA_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AKASHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AKASHA_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}    # the team config, never the code of a pull request
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}      # a repository variable can name a mirror or a fork
        run: pip install "${AKASHA_SOURCE:-git+https://github.com/Gruci/akasha-team-harness@v1.0.0}"
      - name: Merge the pull request, or bring it up to date
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AKASHA_TOKEN || github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          # After an update with the workflow token, the check waits until a person approves its run
          UPDATE: ${{ steps.app.outputs.token != '' || secrets.AKASHA_TOKEN != '' }}
        run: >-
          python -m akasha server merge --repository "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
          --update-branch "$UPDATE"
  failed:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}      # a repository variable can name a mirror or a fork
        run: pip install "${AKASHA_SOURCE:-git+https://github.com/Gruci/akasha-team-harness@v1.0.0}"
      - name: Tell the holder of the task
        env:
          GH_TOKEN: ${{ github.token }}                 # a comment needs no other workflow
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -m akasha server failed --repository "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
