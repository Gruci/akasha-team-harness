# Akasha installs this file. It runs after each push to the default branch.
# watch: where GitHub has no branch protection, for example a private repository on GitHub Free, it undoes each change
#   that went around the check akasha and opens an issue. When GitHub protects the default branch, it does nothing.
# update: with the GitHub app of Akasha, it brings each open pull request with the label akasha-merge up to date, also
#   when GitHub protects the default branch: GitHub does not do it. With the workflow token, the check of an updated
#   pull request waits until a person approves its run, so the job runs only with the app.
name: akasha-watch
on:
  push:
permissions:
  contents: write
  issues: write
  pull-requests: read
  checks: read
jobs:
  watch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Make a token of the GitHub app of Akasha
        id: app
        if: ${{ vars.AKASHA_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AKASHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AKASHA_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false                # git fetches and pushes with the token of the undo step
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}      # a repository variable can name a mirror or a fork
        run: pip install "${AKASHA_SOURCE:-git+https://github.com/Gruci/akasha-team-harness@v1.0.0}"
      - name: Undo a change that went around the check
        env:
          # A push with the app token starts the workflows of the default branch, for example a deployment. The watch
          # then examines its own undo and keeps it, so there is no loop. A push with the workflow token starts no
          # workflow.
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AKASHA_TOKEN || github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          PUSHER: ${{ github.event.pusher.name }}
        run: |
          gh auth setup-git
          python -m akasha server watch --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --before "$BEFORE" --after "$AFTER" --forced "$FORCED" --pusher "$PUSHER"
  update:
    if: github.ref_name == github.event.repository.default_branch && vars.AKASHA_APP_CLIENT_ID != ''
    concurrency:
      group: akasha-update
      # Each run examines all pull requests with the label, so a waiting run that GitHub cancels is no loss
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Make a token of the GitHub app of Akasha
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AKASHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AKASHA_APP_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}      # a repository variable can name a mirror or a fork
        run: pip install "${AKASHA_SOURCE:-git+https://github.com/Gruci/akasha-team-harness@v1.0.0}"
      - name: Bring the pull requests up to date
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python -m akasha server update --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
