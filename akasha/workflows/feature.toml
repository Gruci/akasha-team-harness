# The feature workflow: six stages from a request to a merged pull request.
name = "feature"

[[stages]]
id = "request"
exit = ["conditions_clear"]

[[stages]]
id = "specification"
exit = ["requester_approved", "impact_assessed", "risk_approvals"]

[[stages]]
id = "build"
exit = ["scope_respected"]

[[stages]]
id = "checks"
exit = ["checks_pass"]

[[stages]]
id = "inspection"
exit = ["accepted", "map_current", "infra_ready"]

[[stages]]
id = "handover"
exit = ["merged"]
