# The fix workflow: find the cause of a defect, repair it, and prove the repair.
name = "fix"

[[stages]]
id = "request"
exit = ["conditions_clear"]

[[stages]]
id = "build"
exit = ["impact_assessed", "scope_respected"]

[[stages]]
id = "checks"
exit = ["checks_pass"]

[[stages]]
id = "inspection"
exit = ["accepted", "map_current", "infra_ready"]

[[stages]]
id = "handover"
exit = ["merged"]
