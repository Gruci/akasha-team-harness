name = "python"
extensions = [".py"]
setup = "python -m pip install -r requirements.txt"
tests = "python -m pytest -q"
ignore = ["__pycache__/", "*.pyc", ".pytest_cache/", ".ruff_cache/"]
manifests = ["pyproject.toml", "requirements*.txt"]
lint = "python -m ruff check --extend-select N ."
rules = ["**/ruff.toml"]
