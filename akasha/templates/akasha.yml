# The check of Akasha. Akasha installs this file in each repository that uses it, also beside the CI of the team
# ([ci] required in akasha.toml): the CI of the team need not run a command of Akasha.
# It runs the required checks of akasha.toml on a push to a pull request. Each commit that Akasha pushes before the
# landing carries [skip ci], so a task has one run: at the landing, on the code that merges. The rules come from the
# default branch, so a pull request cannot make its own checks weaker.
name: akasha
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
permissions:
  contents: read
concurrency:
  group: akasha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  akasha:
    runs-on: @@AKASHA_RUNS_ON@@
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "@@AKASHA_PYTHON@@"
      # The Akasha of the team: [team] version in akasha.toml of this checkout, so a raise of the version changes no
      # line here. A pull request that raises the version installs its new version, and the version check compares
      # it with the base branch. The repository variable AKASHA_SOURCE replaces the source.
      - name: Install Akasha
        shell: bash
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}
        run: |
          if [ -z "$AKASHA_SOURCE" ]; then
            version=$(python -c "import pathlib, tomllib; found = [place for place in ('akasha.toml', '.github/akasha.toml') if pathlib.Path(place).is_file()]; print(tomllib.loads(pathlib.Path(found[0]).read_text(encoding='utf-8-sig')).get('team', {}).get('version', '') if found else '', end='')")
            version="${version#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::akasha.toml has no [team] version such as 2.0.7, so the server cannot install Akasha: an administrator runs akasha setup in a task"
              exit 1
            fi
            AKASHA_SOURCE="@@AKASHA_SOURCE@@$version"
          fi
          pip install "$AKASHA_SOURCE"
      - name: Find the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: echo "BASE=${BASE_REF#refs/heads/}" >> "$GITHUB_ENV"
      - name: Take the team config from the base branch
        run: |
          for place in akasha.toml .github/akasha.toml; do
            if git cat-file -e "origin/$BASE:$place" 2>/dev/null; then
              git show "origin/$BASE:$place" > "$RUNNER_TEMP/akasha.toml"
              break
            fi
          done
          if [ ! -f "$RUNNER_TEMP/akasha.toml" ]; then
            for place in akasha.toml .github/akasha.toml; do
              if [ -f "$place" ]; then cp "$place" "$RUNNER_TEMP/akasha.toml"; break; fi
            done
          fi
      - name: Required checks
        env:
          AKASHA_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AKASHA_PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: python -X utf8 -m akasha check --ci --config "$RUNNER_TEMP/akasha.toml" --base "origin/$BASE"
