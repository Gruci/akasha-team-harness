# The check of Akasha. Akasha installs this file in each repository that uses it, also beside the CI of the team
# ([ci] required in akasha.toml): the CI of the team need not run a command of Akasha.
# It runs the required checks of akasha.toml on each push to a pull request, also to a draft: Akasha pushes a task only
# after its checks passed on the computer, and the landing counts the run on the draft, so marking the draft ready
# starts no second run of the same commit. The rules come from the default branch, so a pull request cannot make its
# own checks weaker.
name: akasha
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
permissions:
  contents: read
concurrency:
  group: akasha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  akasha:
    runs-on: @@AKASHA_RUNS_ON@@
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "@@AKASHA_PYTHON@@"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}
        run: pip install "${AKASHA_SOURCE:-@@AKASHA_SOURCE@@}"
      - name: Find the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: echo "BASE=${BASE_REF#refs/heads/}" >> "$GITHUB_ENV"
      - name: Take the team config from the base branch
        run: |
          for place in akasha.toml .github/akasha.toml; do
            if git cat-file -e "origin/$BASE:$place" 2>/dev/null; then
              git show "origin/$BASE:$place" > "$RUNNER_TEMP/akasha.toml"
              break
            fi
          done
          if [ ! -f "$RUNNER_TEMP/akasha.toml" ]; then
            for place in akasha.toml .github/akasha.toml; do
              if [ -f "$place" ]; then cp "$place" "$RUNNER_TEMP/akasha.toml"; break; fi
            done
          fi
      - name: Required checks
        env:
          AKASHA_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AKASHA_PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: python -X utf8 -m akasha check --ci --config "$RUNNER_TEMP/akasha.toml" --base "origin/$BASE"
