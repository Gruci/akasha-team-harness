# Akasha installs this file where GitHub cannot protect the default branch, for example a private repository on
# GitHub Free. After each push to the default branch, it examines each new commit: the commit came from the pull
# request of an Akasha task, its checks passed, the person approved its preview and the plan passed its review, and a
# change of a risky path or of the rules of the team has the review of its owners. It reports each problem to the
# administrators in an issue. It changes no code.
name: akasha-watch
on:
  push:
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  statuses: read
jobs:
  watch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Akasha
        env:
          AKASHA_SOURCE: ${{ vars.AKASHA_SOURCE }}
        run: pip install "${AKASHA_SOURCE:-@@AKASHA_SOURCE@@}"
      - name: Examine the new commits
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          PUSHER: ${{ github.event.pusher.name }}
        run: >-
          python -X utf8 -m akasha server watch --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
          --before "$BEFORE" --after "$AFTER" --forced "$FORCED" --pusher "$PUSHER"
