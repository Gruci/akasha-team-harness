<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Akasha</title>
  <desc id="desc">Akasha lets your whole team build one product with AI: sales, operations, finance, and developers. The product does not drift.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="24" fill="url(#background)"/>
  <circle cx="820" cy="40" r="120" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="820" cy="40" r="80" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="2"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="86" font-size="54" font-weight="700" fill="#ffffff">Akasha</text>
    <text x="50" y="116" font-size="14" font-weight="600" letter-spacing="2" fill="#c4b5fd">TEAM HARNESS · V1.1.5</text>
    <text x="48" y="150" font-size="21" fill="#ede9fe">Your whole team builds one product with AI. It doesn't drift.</text>
    <g stroke="#a78bfa" stroke-width="1.5">
      <rect x="48" y="178" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="232" y="178" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="416" y="178" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="600" y="178" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.22"/>
    </g>
    <g font-size="15" font-weight="600" fill="#f5f3ff" text-anchor="middle">
      <text x="133" y="201">Sales</text>
      <text x="317" y="201">Operations</text>
      <text x="501" y="201">Finance</text>
      <text x="685" y="201">Developers</text>
    </g>
    <text x="48" y="242" font-size="14" fill="#c4b5fd">A team harness for Claude Code and Codex · Each person approves one preview · Your rules hold</text>
  </g>
</svg>
