<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-label="Six stages with an Akasha gate between each. 1 Request: the completion conditions are clear; the requester answers. 2 Specification: impact recorded and the requester approves. 3 Build: only files in the scope changed. 4 Checks: all required checks pass; after three failed repairs a developer steps in. 5 Inspection: the requester accepts in a preview and the product map shows the change. 6 Handover: the server check passes and GitHub merges one commit. The AI does the work of every stage.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;fill:#e6edf3}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#8b949e}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.akasha{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#c4b5fd}
.name{font-size:15px;font-weight:700}
.small{font-size:12.5px;fill:#8b949e}
.msg{font-size:13px;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}
.row{font-size:13px;font-weight:600}
.how{font-size:12.5px;fill:#8b949e}
.gate{font-size:12.5px;fill:#c4b5fd}
.who{font-size:12px;fill:#f0b072}
.gh{font-size:12px;fill:#7ee787}
.ai{font-size:13px;fill:#79c0ff}
.foot{font-size:14px;fill:#8b949e}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
</defs>
<rect width="1000" height="392" rx="14" fill="#0d1117"/>
<text x="24" y="42" class="title">Six stages, a gate between each</text>
<text x="24" y="66" class="sub">The AI does the work of every stage. Akasha opens the next stage only when the exit condition is met.</text>
<rect x="17" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="31" y="116" class="label">STAGE 1</text>
<text x="31" y="140" class="name">Request</text>
<path d="M31,154 L149,154" stroke="#30363d"/>
<text x="31" y="178" class="how">The completion</text>
<text x="31" y="197" class="how">conditions are clear</text>
<rect x="17" y="284" width="146" height="28" rx="8" fill="#271a0e" stroke="#8a5a1c"/><circle cx="31" cy="298.0" r="3.5" fill="#f0883e"/><text x="43" y="302.5" class="who">requester answers</text>
<rect x="181" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="195" y="116" class="label">STAGE 2</text>
<text x="195" y="140" class="name">Specification</text>
<path d="M195,154 L313,154" stroke="#30363d"/>
<text x="195" y="178" class="how">Impact recorded,</text>
<text x="195" y="197" class="how">requester approves</text>
<rect x="181" y="284" width="146" height="28" rx="8" fill="#271a0e" stroke="#8a5a1c"/><circle cx="195" cy="298.0" r="3.5" fill="#f0883e"/><text x="207" y="302.5" class="who">requester approves</text>
<circle cx="172.0" cy="158" r="11" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<path d="M169.0,153 L174.0,158 L169.0,163" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="345" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="359" y="116" class="label">STAGE 3</text>
<text x="359" y="140" class="name">Build</text>
<path d="M359,154 L477,154" stroke="#30363d"/>
<text x="359" y="178" class="how">Only files in</text>
<text x="359" y="197" class="how">the scope changed</text>
<circle cx="336.0" cy="158" r="11" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<path d="M333.0,153 L338.0,158 L333.0,163" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="509" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="523" y="116" class="label">STAGE 4</text>
<text x="523" y="140" class="name">Checks</text>
<path d="M523,154 L641,154" stroke="#30363d"/>
<text x="523" y="178" class="how">All required</text>
<text x="523" y="197" class="how">checks pass</text>
<rect x="509" y="284" width="146" height="44" rx="8" fill="#271a0e" stroke="#8a5a1c"/><circle cx="523" cy="298.0" r="3.5" fill="#f0883e"/><text x="535" y="302.5" class="who">3 failed repairs:</text><text x="535" y="318.5" class="who">a developer steps in</text>
<circle cx="500.0" cy="158" r="11" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<path d="M497.0,153 L502.0,158 L497.0,163" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="673" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="687" y="116" class="label">STAGE 5</text>
<text x="687" y="140" class="name">Inspection</text>
<path d="M687,154 L805,154" stroke="#30363d"/>
<text x="687" y="178" class="how">Accepted in a preview,</text>
<text x="687" y="197" class="how">product map shows</text>
<text x="687" y="216" class="how">the change</text>
<rect x="673" y="284" width="146" height="28" rx="8" fill="#271a0e" stroke="#8a5a1c"/><circle cx="687" cy="298.0" r="3.5" fill="#f0883e"/><text x="699" y="302.5" class="who">requester accepts</text>
<circle cx="664.0" cy="158" r="11" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<path d="M661.0,153 L666.0,158 L661.0,163" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="837" y="92" width="146" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="851" y="116" class="label">STAGE 6</text>
<text x="851" y="140" class="name">Handover</text>
<path d="M851,154 L969,154" stroke="#30363d"/>
<text x="851" y="178" class="how">Server check passes,</text>
<text x="851" y="197" class="how">one commit merges</text>
<rect x="837" y="284" width="146" height="28" rx="8" fill="#112119" stroke="#3fb950"/><circle cx="851" cy="298.0" r="3.5" fill="#3fb950"/><text x="863" y="302.5" class="gh">GitHub merges</text>
<circle cx="828.0" cy="158" r="11" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
<path d="M825.0,153 L830.0,158 L825.0,163" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="17" y="238" width="966" height="32" rx="8" fill="#0c2d6b" fill-opacity=".45" stroke="#1f6feb"/>
<text x="500" y="259" class="ai" text-anchor="middle">The AI does the work of every stage</text>
<circle cx="29" cy="363" r="5" fill="#a78bfa"/>
<text x="40" y="368" class="small">Akasha gate</text>
<circle cx="150" cy="363" r="5" fill="#f0883e"/>
<text x="161" y="368" class="small">a person decides</text>
<circle cx="306" cy="363" r="5" fill="#3fb950"/>
<text x="317" y="368" class="small">GitHub</text>
<circle cx="392" cy="363" r="5" fill="#2f81f7"/>
<text x="403" y="368" class="small">the AI</text>
</svg>
