<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="0 0 1000 724" role="img" aria-label="개발자가 아닌 운영팀원의 요청 하나가 병합되기까지. 요청자가 고객 검색에 날짜 필터를 요청합니다. AI 가 어느 날짜인지, 권한 없는 고객도 보여야 하는지 묻고, 고객 테이블을 읽는 보고서 두 개를 찾아 영향도를 기록하고, 과업 전용 작업 사본에서 조건마다 테스트를 붙여 만들고, 검사를 통과한 뒤 미리보기를 보여 요청자의 수용을 받고, PR 을 열어 GitHub 가 브리핑과 함께 커밋 하나로 병합합니다. AI 는 Akasha 하네스 안에서 일하고, 하네스의 관문이 단계마다 붙잡습니다: 완료 조건 분명, 영향도 기록, 작업 사본 안에서만, 검사 통과, 요청자 수용, 서버 검사 akasha.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;fill:#e6edf3}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#8b949e}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.akasha{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#c4b5fd}
.name{font-size:15px;font-weight:700}
.small{font-size:12.5px;fill:#8b949e}
.msg{font-size:13px;paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}
.row{font-size:13px;font-weight:600}
.how{font-size:12.5px;fill:#8b949e}
.gate{font-size:12.5px;fill:#c4b5fd}
.who{font-size:12px;fill:#f0b072}
.gh{font-size:12px;fill:#7ee787}
.ai{font-size:13px;fill:#79c0ff}
.foot{font-size:14px;fill:#8b949e}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
</defs>
<rect width="1000" height="724" rx="14" fill="#0d1117"/>
<text x="26" y="42" class="title">요청 하나가 병합되기까지</text>
<text x="26" y="66" class="sub">개발자가 아닌 운영팀원의 요청. 모든 단계를 AI 가 Akasha 하네스 안에서 합니다.</text>
<rect x="232" y="78" width="556" height="542" rx="14" fill="#a78bfa" fill-opacity=".04" stroke="#a78bfa" stroke-width="1.5"/>
<path d="M110,154 L110,640" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M420,154 L420,640" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M894,154 L894,640" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="24" y="94" width="172" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="44" cy="116" r="5" fill="#f0883e"/><text x="56" y="121" class="name">요청자</text><text x="38" y="142" class="small">운영팀원</text>
<rect x="322" y="94" width="196" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="342" cy="116" r="5" fill="#2f81f7"/><text x="354" y="121" class="name">AI</text><text x="336" y="142" class="small">Claude Code 나 Codex</text>
<rect x="812" y="94" width="164" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="832" cy="116" r="5" fill="#3fb950"/><text x="844" y="121" class="name">GitHub</text><text x="826" y="142" class="small">서버 검사, 병합</text>
<text x="606" y="112" class="akasha">AKASHA 하네스</text>
<text x="606" y="132" class="small">스킬 · 훅 · 관문</text>
<text x="265" y="180" class="msg" text-anchor="middle">“고객 검색에 날짜 필터</text>
<text x="265" y="196" class="msg" text-anchor="middle">넣어 줘.”</text>
<path d="M114,208 L414,208" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M114,208 L414,208"/></circle>
<text x="265" y="238" class="msg" text-anchor="middle">“가입일인가요, 거래일인가요?”</text>
<text x="265" y="254" class="msg" text-anchor="middle">“권한 없는 고객도 보여야 하나요?”</text>
<path d="M416,266 L116,266" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite" path="M416,266 L116,266"/></circle>
<rect x="606" y="246" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="260.0" r="3.5" fill="#a78bfa"/><text x="632" y="264.5" class="gate">완료 조건 분명</text>
<rect x="248" y="290" width="344" height="79" rx="8" fill="#161b22" stroke="#30363d"/><text x="264" y="316" class="row">고객 테이블을 읽는 보고서 두 개를 찾음</text><text x="264" y="335" class="how">영향: 인덱스 추가, 데이터 변경 없음,</text><text x="264" y="354" class="how">커밋을 되돌리면 원상 복구</text>
<rect x="606" y="312" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="326.0" r="3.5" fill="#a78bfa"/><text x="632" y="330.5" class="gate">영향도 기록</text>
<rect x="248" y="384" width="344" height="60" rx="8" fill="#161b22" stroke="#30363d"/><text x="264" y="410" class="row">조건마다 테스트를 붙여 만듦</text><text x="264" y="429" class="how">과업 전용 작업 사본에서</text>
<rect x="606" y="396" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="410.0" r="3.5" fill="#a78bfa"/><text x="632" y="414.5" class="gate">작업 사본 안에서만</text>
<text x="265" y="466" class="msg" text-anchor="middle">검사 통과 — 조건마다 미리보기</text>
<path d="M416,478 L116,478" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M416,478 L116,478"/></circle>
<text x="265" y="504" class="msg" text-anchor="middle">“맞아요.” — 조건마다 수용</text>
<path d="M114,516 L414,516" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" path="M114,516 L414,516"/></circle>
<rect x="606" y="462" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="476.0" r="3.5" fill="#a78bfa"/><text x="632" y="480.5" class="gate">검사 통과</text>
<rect x="606" y="496" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="510.0" r="3.5" fill="#a78bfa"/><text x="632" y="514.5" class="gate">요청자 수용</text>
<text x="657" y="556" class="msg" text-anchor="middle">브리핑을 담은 PR</text>
<path d="M424,568 L888,568" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2.4s" begin="-0.3s" repeatCount="indefinite" path="M424,568 L888,568"/></circle>
<rect x="606" y="582" width="168" height="28" rx="8" fill="#211a3a" stroke="#6d5bd0"/><circle cx="620" cy="596.0" r="3.5" fill="#a78bfa"/><text x="632" y="600.5" class="gate">서버 검사 <tspan class="code">akasha</tspan></text>
<rect x="806" y="584" width="176" height="60" rx="10" fill="#112119" stroke="#3fb950" stroke-width="1.5"/>
<text x="822" y="608" class="row">커밋 하나로 병합</text>
<text x="822" y="628" class="how">“Add a date filter (#42)”</text>
<rect x="24" y="660" width="952" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="500" y="687" class="foot" text-anchor="middle">Akasha 는 말하지 않습니다. 보라색 관문에서 AI 를 절차에 붙잡아 둘 뿐입니다.</text>
</svg>
