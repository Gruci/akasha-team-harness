<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="900" height="456" viewBox="0 0 900 456" role="img" aria-labelledby="title desc">
<title id="title">여러 팀이 동시에 하나의 제품을 만든다</title>
<desc id="desc">세 팀(영업팀, 운영팀, 재무팀)의 사람이 각자 쉬운 말로 변경을 요청하고, 시안만 승인합니다. 과업마다 AI 가 계획하고, 두 번째 AI 가 계획을 검사하고, AI 가 자기 작업 사본에서 구현하고 테스트합니다. 이 일은 모두 동시에 진행됩니다. 공유 보드가 누가 무엇을 만드는지, 어디서 겹치는지 보여 줍니다. 과업은 검사를 통과하면 하나씩 하나의 메인 브랜치로 병합되고, 뒤 과업은 앞서 병합된 내용으로 먼저 최신으로 맞춘 뒤 다시 검사합니다.</desc>
<style>
.label,.name,.sub,.ok,.row,.how,.edge,.step,.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.name{font-size:15px;font-weight:700;fill:#e6edf3}
.name.main{fill:#3fb950}
.sub{font-size:13px;fill:#8b949e}
.ok{font-size:12.5px;fill:#8b949e}
.row{font-size:13.5px;font-weight:600;fill:#e6edf3}
.how{font-size:12.5px;fill:#8b949e}
.edge{font-size:12px;fill:#8b949e}
.step{font-size:12px;font-weight:600;fill:#e6edf3}
.tag{font-size:16px;font-weight:600;fill:#e6edf3}
.card{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.chip{fill:#0d1117;stroke:#30363d;stroke-width:1}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
<marker id="small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
<marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#30363d"/></marker>
</defs>
<rect width="900" height="456" rx="12" fill="#0d1117"/>

<!-- 열 제목 -->
<text x="24" y="36" class="label">각 팀의 사람</text>
<text x="24" y="56" class="how">요청하고, 시안을 승인</text>
<text x="252" y="36" class="label">과업마다 AI 하나, 동시에</text>
<text x="252" y="56" class="how">계획 · 두 번째 AI 가 계획 검사 · 구현 · 테스트</text>
<path d="M410,32 L686,32" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5" fill="none" marker-end="url(#time)"/>
<text x="700" y="36" class="label">하나의 제품</text>
<text x="700" y="56" class="how">하나씩 병합</text>

<!-- 사람 카드 -->
<rect x="24" y="119" width="180" height="76" rx="10" class="card"/>
<text x="40" y="142" class="name">영업팀</text>
<text x="40" y="162" class="sub">“CSV 내려받기 넣어 줘”</text>
<text x="40" y="180" class="ok"><tspan fill="#3fb950">✓</tspan> 시안 승인</text>
<rect x="24" y="205" width="180" height="76" rx="10" class="card"/>
<text x="40" y="228" class="name">운영팀</text>
<text x="40" y="248" class="sub">“배치 상태를 보여 줘”</text>
<text x="40" y="266" class="ok"><tspan fill="#3fb950">✓</tspan> 시안 승인</text>
<rect x="24" y="291" width="180" height="76" rx="10" class="card"/>
<text x="40" y="314" class="name">재무팀</text>
<text x="40" y="334" class="sub">“월 합계를 넣어 줘”</text>
<text x="40" y="352" class="ok"><tspan fill="#3fb950">✓</tspan> 시안 승인</text>

<!-- AI 틀: 위에 보드, 과업마다 줄 하나 -->
<rect x="252" y="72" width="368" height="300" rx="12" fill="#161b22" stroke="#2f81f7" stroke-width="1.5"/>
<text x="270" y="98" class="row">보드</text><text x="307" y="98" class="how">누가 무엇을 만드는지, 어디서 겹치는지</text>
<path d="M270,114 L602,114 M270,200 L602,200 M270,286 L602,286" stroke="#30363d" stroke-width="1"/>
<g>
<rect x="270" y="143" width="46" height="28" rx="6" class="chip"/><text x="293" y="161" text-anchor="middle" class="step">계획</text>
<rect x="352" y="143" width="74" height="28" rx="6" class="chip"/><text x="389" y="161" text-anchor="middle" class="step">계획 검사</text>
<rect x="462" y="143" width="46" height="28" rx="6" class="chip"/><text x="485" y="161" text-anchor="middle" class="step">구현</text>
<rect x="544" y="143" width="58" height="28" rx="6" class="chip"/><text x="573" y="161" text-anchor="middle" class="step">테스트</text>
<rect x="270" y="229" width="46" height="28" rx="6" class="chip"/><text x="293" y="247" text-anchor="middle" class="step">계획</text>
<rect x="352" y="229" width="74" height="28" rx="6" class="chip"/><text x="389" y="247" text-anchor="middle" class="step">계획 검사</text>
<rect x="462" y="229" width="46" height="28" rx="6" class="chip"/><text x="485" y="247" text-anchor="middle" class="step">구현</text>
<rect x="544" y="229" width="58" height="28" rx="6" class="chip"/><text x="573" y="247" text-anchor="middle" class="step">테스트</text>
<rect x="270" y="315" width="46" height="28" rx="6" class="chip"/><text x="293" y="333" text-anchor="middle" class="step">계획</text>
<rect x="352" y="315" width="74" height="28" rx="6" class="chip"/><text x="389" y="333" text-anchor="middle" class="step">계획 검사</text>
<rect x="462" y="315" width="46" height="28" rx="6" class="chip"/><text x="485" y="333" text-anchor="middle" class="step">구현</text>
<rect x="544" y="315" width="58" height="28" rx="6" class="chip"/><text x="573" y="333" text-anchor="middle" class="step">테스트</text>
</g>
<g stroke="#3d444d" stroke-width="1.5" fill="none" marker-end="url(#small)">
<path d="M322,157 L346,157"/><path d="M432,157 L456,157"/><path d="M514,157 L538,157"/>
<path d="M322,243 L346,243"/><path d="M432,243 L456,243"/><path d="M514,243 L538,243"/>
<path d="M322,329 L346,329"/><path d="M432,329 L456,329"/><path d="M514,329 L538,329"/>
</g>

<!-- 사람에서 줄로 -->
<path d="M208,157 L246,157" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M208,157 L246,157"/></circle>
<path d="M208,243 L246,243" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="-0.7s" repeatCount="indefinite" path="M208,243 L246,243"/></circle>
<path d="M208,329 L246,329" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/><circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="2s" begin="-1.4s" repeatCount="indefinite" path="M208,329 L246,329"/></circle>

<!-- 메인 브랜치로 하나씩 병합 -->
<g stroke="#238636" stroke-width="2" fill="none" marker-end="url(#green)">
<path d="M624,157 C668,157 664,216 696,216"/>
<path d="M624,243 L696,243"/>
<path d="M624,329 C668,329 664,270 696,270"/>
</g>
<!-- 뒤 과업은 앞서 병합된 내용으로 먼저 최신으로 맞춘다 -->
<path d="M788,324 L788,350 L628,350" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#green)"/>
<text x="712" y="342" text-anchor="middle" class="edge">최신으로 맞춤</text>

<rect x="700" y="168" width="176" height="150" rx="10" fill="#112119" stroke="#3fb950" stroke-width="1.5"/>
<circle cx="720" cy="193" r="5" fill="#3fb950"/><text x="732" y="198" class="name main">메인 브랜치</text>
<path d="M716,218 L860,218" stroke="#238636" stroke-width="2"/>
<circle cx="740" cy="218" r="5" fill="#3fb950" stroke="#112119" stroke-width="2"/>
<circle cx="788" cy="218" r="5" fill="#3fb950" stroke="#112119" stroke-width="2"/>
<circle cx="836" cy="218" r="5" fill="#3fb950" stroke="#112119" stroke-width="2"/>
<text x="716" y="246" class="how">과업마다 검사가</text>
<text x="716" y="264" class="how">통과하면 병합,</text>
<text x="716" y="282" class="how">뒤 과업은 최신으로</text>
<text x="716" y="300" class="how">맞춘 뒤 다시 검사</text>

<!-- 6초 주기로 차례로 움직이는 점: 병합 1, 병합 2, 최신으로 맞춤, 병합 3 -->
<circle r="4" fill="#3fb950" class="dot"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear" path="M624,157 C668,157 664,216 696,216"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.17" calcMode="discrete" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#3fb950" opacity="0" class="dot"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear" path="M624,243 L696,243"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.17" calcMode="discrete" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#3fb950" opacity="0" class="dot"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear" path="M788,324 L788,350 L628,350"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.17" calcMode="discrete" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#3fb950" opacity="0" class="dot"><animateMotion dur="6s" begin="4.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear" path="M624,329 C668,329 664,270 696,270"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.17" calcMode="discrete" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle>
<!-- 병합이 들어올 때마다 메인의 커밋이 퍼진다 -->
<circle cx="740" cy="218" r="5" fill="none" stroke="#3fb950" stroke-width="2" opacity="0" class="dot"><animate attributeName="r" values="5;12;12" keyTimes="0;0.12;1" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.12;1" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="788" cy="218" r="5" fill="none" stroke="#3fb950" stroke-width="2" opacity="0" class="dot"><animate attributeName="r" values="5;12;12" keyTimes="0;0.12;1" dur="6s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.12;1" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
<circle cx="836" cy="218" r="5" fill="none" stroke="#3fb950" stroke-width="2" opacity="0" class="dot"><animate attributeName="r" values="5;12;12" keyTimes="0;0.12;1" dur="6s" begin="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.12;1" dur="6s" begin="5.5s" repeatCount="indefinite"/></circle>

<!-- 한 줄 요약 -->
<text x="450" y="408" text-anchor="middle" class="tag">사람은 원하는 것을 말하고, 눈으로 본 시안만 승인합니다.</text>
<text x="450" y="432" text-anchor="middle" class="tag">나머지는 AI 가 하고, 모든 팀의 과업이 하나의 제품으로 합쳐집니다.</text>
</svg>
