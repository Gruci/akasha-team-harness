<text x="26" y="66" class="sub">사람은 시안이나 결과만 승인합니다. 과업마다 AI 가 자기 레인에서 일하고, 두 번째 AI 가 계획을 검사합니다.</text>
<text x="200" y="100" class="label">같은 레포 · 같은 시간</text>
