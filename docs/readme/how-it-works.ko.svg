<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">여러 팀이 동시에 하나의 제품을 만든다</title>
  <desc id="desc">세 팀이 동시에 변경을 요청합니다. 각 사람은 시안만 승인합니다. 과업마다 AI 가 자기 작업 폴더에서 계획하고, 두 번째 AI 가 계획을 검사하고, 구현하고, 테스트합니다. 공유 보드가 누가 무엇을 만드는지 보여 줍니다. 과업들은 하나씩 하나의 제품으로 합쳐지고, 뒤 과업은 최신으로 맞춘 뒤 다시 검사합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="110" y="40" fill="#92400e">각 팀의 사람</text>
      <text x="400" y="40" fill="#5b21b6">과업마다 AI 하나, 동시에</text>
      <text x="770" y="40" fill="#166534">하나의 제품</text>
    </g>
    <g font-size="11" fill="#6b7280" text-anchor="middle">
      <text x="110" y="56">요청하고, 시안을 승인</text>
      <text x="400" y="56">계획 · 두 번째 AI 가 계획 검사 · 구현 · 테스트</text>
      <text x="770" y="56">하나씩 병합</text>
    </g>

    <rect x="215" y="70" width="370" height="26" rx="13" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="400" y="88" font-size="12" fill="#374151" text-anchor="middle">보드: 누가 무엇을 만드는지, 어디서 겹치는지</text>

    <g>
      <rect x="30" y="112" width="160" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="137" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">영업팀</text>
      <text x="110" y="157" font-size="11" fill="#374151" text-anchor="middle">"CSV 내려받기 넣어 줘"</text>
      <text x="110" y="170" font-size="11" fill="#92400e" text-anchor="middle">✓ 시안 승인</text>
      <rect x="215" y="112" width="370" height="64" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>

      <rect x="30" y="192" width="160" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="217" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">운영팀</text>
      <text x="110" y="237" font-size="11" fill="#374151" text-anchor="middle">"배치 상태를 보여 줘"</text>
      <text x="110" y="250" font-size="11" fill="#92400e" text-anchor="middle">✓ 시안 승인</text>
      <rect x="215" y="192" width="370" height="64" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>

      <rect x="30" y="272" width="160" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="297" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">재무팀</text>
      <text x="110" y="317" font-size="11" fill="#374151" text-anchor="middle">"월 합계를 넣어 줘"</text>
      <text x="110" y="330" font-size="11" fill="#92400e" text-anchor="middle">✓ 시안 승인</text>
      <rect x="215" y="272" width="370" height="64" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    </g>

    <g font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">
      <text x="262" y="149">계획</text><text x="352" y="149">계획 검사</text><text x="447" y="149">구현</text><text x="535" y="149">테스트</text>
      <text x="262" y="229">계획</text><text x="352" y="229">계획 검사</text><text x="447" y="229">구현</text><text x="535" y="229">테스트</text>
      <text x="262" y="309">계획</text><text x="352" y="309">계획 검사</text><text x="447" y="309">구현</text><text x="535" y="309">테스트</text>
    </g>
    <g stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="285" y1="144" x2="312" y2="144"/><line x1="393" y1="144" x2="424" y2="144"/><line x1="470" y1="144" x2="504" y2="144"/>
      <line x1="285" y1="224" x2="312" y2="224"/><line x1="393" y1="224" x2="424" y2="224"/><line x1="470" y1="224" x2="504" y2="224"/>
      <line x1="285" y1="304" x2="312" y2="304"/><line x1="393" y1="304" x2="424" y2="304"/><line x1="470" y1="304" x2="504" y2="304"/>
    </g>

    <g stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="192" y1="144" x2="212" y2="144"/>
      <line x1="192" y1="224" x2="212" y2="224"/>
      <line x1="192" y1="304" x2="212" y2="304"/>
    </g>

    <g stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#merge)">
      <path d="M587 144 C 640 144, 640 210, 683 214"/>
      <line x1="587" y1="224" x2="683" y2="224"/>
      <path d="M587 304 C 640 304, 640 238, 683 234"/>
    </g>
    <rect x="686" y="172" width="170" height="104" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
    <text x="771" y="206" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">메인 브랜치</text>
    <text x="771" y="228" font-size="11" fill="#374151" text-anchor="middle">검사가 통과하면 병합,</text>
    <text x="771" y="243" font-size="11" fill="#374151" text-anchor="middle">뒤 과업은 최신으로</text>
    <text x="771" y="258" font-size="11" fill="#374151" text-anchor="middle">맞춘 뒤 다시 검사</text>

    <text x="450" y="378" font-size="15" fill="#374151" text-anchor="middle">사람은 원하는 것을 말하고, 눈으로 본 시안만 승인합니다.</text>
    <text x="450" y="400" font-size="15" fill="#374151" text-anchor="middle">나머지는 AI 가 하고, 모든 팀의 과업이 하나의 제품으로 합쳐집니다.</text>
  </g>
</svg>
