<text x="384.0" y="445" class="gatehead" text-anchor="middle">Plan check</text>
<path d="M441,441 L457,441" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="462" y="430" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="494.0" y="445" class="bar" text-anchor="middle">Build</text>
<path d="M531,441 L547,441" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="552" y="430" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="584.0" y="445" class="bar" text-anchor="middle">Tests</text>
<circle cx="660" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="660" y="564" class="commit" text-anchor="middle">#41</text>
<text x="660" y="582" class="how" text-anchor="middle">Monthly total</text>

<!-- after #41 and #42, the later Sales task takes them first: brought up to date, then checked again -->
<path d="M810,532 L810,292" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#stack)"/>
<circle r="3.5" fill="#a78bfa" class="dot"><animateMotion dur="4s" begin="-0.5s" repeatCount="indefinite" path="M810,538 L810,290"/></circle>
<text x="860" y="600" class="gh" text-anchor="middle">brought up to date first</text>

<rect x="24" y="510" width="160" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="532" r="5" fill="#3fb950"/>
<text x="56" y="537" class="name">GitHub</text>
<text x="38" y="558" class="small">main</text>
<rect x="24" y="634" width="952" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="500" y="661" class="foot" text-anchor="middle">Each person says what they want and approves what they see: a preview, or the result of an agent. The AI does the rest.</text>
</svg>
