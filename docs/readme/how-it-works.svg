<rect x="460" y="258" width="92" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="506" y="273" class="bar" text-anchor="middle">AI check</text>
<path d="M555,269 L569,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="572" y="258" width="46" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="595" y="273" class="bar" text-anchor="middle">Build</text>
<path d="M621,269 L635,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="638" y="258" width="52" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="664" y="273" class="bar" text-anchor="middle">Tests</text>
<path d="M693,269 L707,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="710" y="258" width="112" height="22" rx="6" fill="#0f1a13" stroke="#3fb950"/>
<text x="766" y="273" class="sync" text-anchor="middle">↻ Update branch</text>
<circle cx="850" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="850" y="564" class="commit" text-anchor="middle">#43</text>
<text x="850" y="582" class="how" text-anchor="middle">CSV download</text>

<!-- Operations: it starts where Sales starts, so the two build steps stand in one column -->
<rect x="24" y="320" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="340" r="5" fill="#f0883e"/>
<text x="56" y="345" class="name">Operations</text>
<text x="38" y="365" class="small">“Show the batch status”</text>
<text x="38" y="382" class="who">✓ approves the preview</text>
<rect x="288" y="338" width="408" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="294" y="344" width="80" height="22" rx="6" fill="#2a1d0f" stroke="#f0b072"/>
<text x="334" y="359" class="person" text-anchor="middle">Preview OK</text>
<path d="M377,355 L391,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="394" y="344" width="46" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="417" y="359" class="bar" text-anchor="middle">Plan</text>
<path d="M443,355 L457,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="460" y="344" width="92" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="506" y="359" class="bar" text-anchor="middle">AI check</text>
<path d="M555,355 L569,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="572" y="344" width="46" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="595" y="359" class="bar" text-anchor="middle">Build</text>
<path d="M621,355 L635,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="638" y="344" width="52" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="664" y="359" class="bar" text-anchor="middle">Tests</text>
<circle cx="750" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="750" y="564" class="commit" text-anchor="middle">#42</text>
<text x="750" y="582" class="how" text-anchor="middle">Batch status</text>

<!-- Sales and Operations plan the same file: each AI reads the other's change first; no person decides anything -->
<path d="M595,288 L595,336" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="550" y="302" width="90" height="20" rx="10" fill="#0d1117" stroke="#8b949e"/>
<text x="595" y="316" class="tag" text-anchor="middle">⇅ same file</text>
<text x="542" y="316" class="how" text-anchor="end">each AI reads the other's change first</text>

<rect x="24" y="406" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="426" r="5" fill="#f0883e"/>
<text x="56" y="431" class="name">Finance</text>
<text x="38" y="451" class="small">“Add a monthly total”</text>
<text x="38" y="468" class="who">✓ approves the preview</text>
<rect x="216" y="424" width="408" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="222" y="430" width="80" height="22" rx="6" fill="#2a1d0f" stroke="#f0b072"/>
<text x="262" y="445" class="person" text-anchor="middle">Preview OK</text>
