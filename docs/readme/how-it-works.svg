<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="698" viewBox="0 0 1000 698" role="img" aria-label="Several teams and an agent ask at the same time. Only the orange steps are a person's: a team approves its preview at the start, and the person who asked the agent approves its result at the end. Each other step is the AI's, also the check of the plan. When two tasks plan the same file, each AI reads the other's change first. Each task keeps its own pull request; they merge into main one by one, and a later one is first updated from main and checked again, its AI keeping both sides of a conflict.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;fill:#e6edf3}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#8b949e}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.akasha{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#c4b5fd}
.name{font-size:15px;font-weight:700}
.small{font-size:12.5px;fill:#8b949e}
.how{font-size:12.5px;fill:#8b949e}
.who{font-size:12px;fill:#f0b072}
.gh{font-size:12px;fill:#7ee787}
.foot{font-size:14px;fill:#8b949e}
.bar{font-size:13px}
.commit{font-size:13px;font-weight:700;fill:#7ee787}
.person{font-size:13px;font-weight:600;fill:#f0b072}
.sync{font-size:13px;font-weight:600;fill:#7ee787}
.tag{font-size:12px;fill:#c9d1d9}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
<marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#30363d"/></marker>
<marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
</defs>
<rect width="1000" height="698" rx="14" fill="#0d1117"/>
<text x="26" y="42" class="title">Several teams and an agent, one product, at the same time</text>
<text x="26" y="66" class="sub">A person approves only a preview, or the result of an agent. Each task has its own lane, and a second AI checks each plan.</text>
<text x="200" y="100" class="label">ONE REPOSITORY · AT THE SAME TIME</text>
<path d="M478,96 L960,96" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#time)"/>
<rect x="200" y="112" width="776" height="382" rx="14" fill="#a78bfa" fill-opacity=".04" stroke="#a78bfa" stroke-width="1.5"/>
<text x="216" y="138" class="akasha">AKASHA HARNESS</text>
<text x="346" y="138" class="small">task board · gates · one work copy and one pull request for each task</text>
<path d="M200,538 L968,538" stroke="#3fb950" stroke-width="2"/>

<!-- the lanes: from the team to its bar, then down to main -->
<path d="M184,183 L520,183" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M928,183 L950,183 L950,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-3.0s" repeatCount="indefinite" path="M184,183 L950,183 L950,538"/></circle>
<path d="M184,269 L288,269" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M828,269 L850,269 L850,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-0.0s" repeatCount="indefinite" path="M184,269 L850,269 L850,538"/></circle>
<path d="M184,355 L288,355" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M696,355 L750,355 L750,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-1.0s" repeatCount="indefinite" path="M184,355 L750,355 L750,538"/></circle>
<path d="M184,441 L216,441" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M624,441 L650,441 L650,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-2.0s" repeatCount="indefinite" path="M184,441 L650,441 L650,538"/></circle>

<!-- the agent: a program runs it. No person checks its plan: the person who asked approves the result at the end -->
<rect x="24" y="148" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="168" r="5" fill="#79c0ff"/>
<text x="56" y="173" class="name">Agent</text>
<text x="38" y="193" class="small">“Fix the failed batch”</text>
<text x="38" y="210" class="who">✓ result OK at the end</text>
<rect x="520" y="166" width="408" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="526" y="172" width="46" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="549" y="187" class="bar" text-anchor="middle">Plan</text>
<path d="M575,183 L589,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="592" y="172" width="92" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="638" y="187" class="bar" text-anchor="middle">AI check</text>
<path d="M687,183 L701,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="704" y="172" width="46" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="727" y="187" class="bar" text-anchor="middle">Build</text>
<path d="M753,183 L767,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="770" y="172" width="52" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="796" y="187" class="bar" text-anchor="middle">Tests</text>
<path d="M825,183 L839,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="842" y="172" width="80" height="22" rx="6" fill="#2a1d0f" stroke="#f0b072"/>
<text x="882" y="187" class="person" text-anchor="middle">Result OK</text>
<circle cx="950" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="950" y="564" class="commit" text-anchor="middle">#44</text>
<text x="950" y="582" class="how" text-anchor="middle">Batch fix</text>

<!-- Sales: the person approves the preview at the start; the task merges after #41 and #42, so it updates from main first -->
<rect x="24" y="234" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="254" r="5" fill="#f0883e"/>
<text x="56" y="259" class="name">Sales</text>
<text x="38" y="279" class="small">“Add a CSV download”</text>
<text x="38" y="296" class="who">✓ approves the preview</text>
