<text x="650" y="564" class="commit" text-anchor="middle">#41</text>
<text x="650" y="582" class="how" text-anchor="middle">Monthly total</text>

<!-- main after #41 and #42 goes into the later Sales task before its merge -->
<path d="M766,532 L766,290" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#up)"/>
<circle r="3.5" fill="#3fb950" class="dot"><animateMotion dur="4s" begin="-0.5s" repeatCount="indefinite" path="M766,538 L766,290"/></circle>
<text x="773" y="516" class="gh">#41 · #42</text>
<text x="850" y="602" class="gh" text-anchor="middle">updated from main and re-checked before merge</text>
<text x="850" y="618" class="gh" text-anchor="middle">a conflict: the AI keeps both sides</text>

<rect x="24" y="510" width="160" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="532" r="5" fill="#3fb950"/>
<text x="56" y="537" class="name">GitHub</text>
<text x="38" y="558" class="small">main</text>
<rect x="24" y="634" width="952" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="500" y="661" class="foot" text-anchor="middle">Only the orange steps are a person's: the preview at the start, or the result of an agent at the end. The AI does the rest.</text>
</svg>
