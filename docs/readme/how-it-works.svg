<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="698" viewBox="0 0 1000 698" role="img" aria-label="Several teams and an agent ask at the same time. Each person approves only a preview; the person who asked an agent approves its result before the merge. For each task an AI plans, a second AI checks the plan, the AI builds and tests. The board tells two tasks that change the same file. The tasks merge into one product one by one, and a later one is brought up to date with the earlier merges first.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Malgun Gothic",Helvetica,Arial,sans-serif;fill:#e6edf3}
.title{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#8b949e}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#8b949e}
.akasha{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#c4b5fd}
.name{font-size:15px;font-weight:700}
.small{font-size:12.5px;fill:#8b949e}
.how{font-size:12.5px;fill:#8b949e}
.gate{font-size:12.5px;fill:#c4b5fd}
.who{font-size:12px;fill:#f0b072}
.gh{font-size:12px;fill:#7ee787}
.foot{font-size:14px;fill:#8b949e}
.bar{font-size:13px}
.commit{font-size:13px;font-weight:700;fill:#7ee787}
.gatehead{font-size:13px;font-weight:600;fill:#c4b5fd}
.okhead{font-size:13px;font-weight:600;fill:#f0b072}
@media (prefers-reduced-motion:reduce){.dot{display:none}}
</style>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
<marker id="time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#30363d"/></marker>
<marker id="stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
</defs>
<rect width="1000" height="698" rx="14" fill="#0d1117"/>
<text x="26" y="42" class="title">Several teams and an agent, one product, at the same time</text>
<text x="26" y="66" class="sub">A person approves each preview, or the result of an agent. Each task has its own lane, and a second AI checks each plan.</text>
<text x="200" y="100" class="label">ONE REPOSITORY · AT THE SAME TIME</text>
<path d="M478,96 L960,96" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#time)"/>
<rect x="200" y="112" width="776" height="382" rx="14" fill="#a78bfa" fill-opacity=".04" stroke="#a78bfa" stroke-width="1.5"/>
<text x="216" y="138" class="akasha">AKASHA HARNESS</text>
<text x="346" y="138" class="small">task board · gates · one work copy for each task</text>
<path d="M200,538 L968,538" stroke="#3fb950" stroke-width="2"/>

<!-- the lanes: from the team to its bar, then down to main -->
<path d="M184,183 L412,183" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M928,183 L960,183 L960,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-3.0s" repeatCount="indefinite" path="M184,183 L960,183 L960,538"/></circle>
<path d="M184,269 L432,269" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M826,269 L860,269 L860,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-0.0s" repeatCount="indefinite" path="M184,269 L860,269 L860,538"/></circle>
<path d="M184,355 L332,355" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M726,355 L760,355 L760,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-1.0s" repeatCount="indefinite" path="M184,355 L760,355 L760,538"/></circle>
<path d="M184,441 L232,441" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M626,441 L660,441 L660,530" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#head)"/>
<circle r="4" fill="#2f81f7" class="dot"><animateMotion dur="4s" begin="-2.0s" repeatCount="indefinite" path="M184,441 L660,441 L660,538"/></circle>

<!-- the agent: a program runs it; the person who asked approves the result before the merge -->
<rect x="24" y="148" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="168" r="5" fill="#79c0ff"/>
<text x="56" y="173" class="name">Agent</text>
<text x="38" y="193" class="small">“Fix the failed batch”</text>
<text x="38" y="210" class="who">✓ result approved</text>
<rect x="412" y="166" width="516" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="422" y="172" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="454.0" y="187" class="bar" text-anchor="middle">Plan</text>
<path d="M491,183 L507,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="512" y="172" width="104" height="22" rx="6" fill="#211a3a" stroke="#6d5bd0"/>
<text x="564.0" y="187" class="gatehead" text-anchor="middle">Plan check</text>
<path d="M621,183 L637,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="642" y="172" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="674.0" y="187" class="bar" text-anchor="middle">Build</text>
<path d="M711,183 L727,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="732" y="172" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="764.0" y="187" class="bar" text-anchor="middle">Tests</text>
<path d="M801,183 L817,183" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="822" y="172" width="96" height="22" rx="6" fill="#2a1d0f" stroke="#f0b072"/>
<text x="870.0" y="187" class="okhead" text-anchor="middle">Result OK</text>
<circle cx="960" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="960" y="564" class="commit" text-anchor="middle">#44</text>
<text x="960" y="582" class="how" text-anchor="middle">Batch fix</text>

<rect x="24" y="234" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="254" r="5" fill="#f0883e"/>
<text x="56" y="259" class="name">Sales</text>
<text x="38" y="279" class="small">“Add a CSV download”</text>
<text x="38" y="296" class="who">✓ approves the preview</text>
<rect x="432" y="252" width="394" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="442" y="258" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="474.0" y="273" class="bar" text-anchor="middle">Plan</text>
<path d="M511,269 L527,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="532" y="258" width="104" height="22" rx="6" fill="#211a3a" stroke="#6d5bd0"/>
<text x="584.0" y="273" class="gatehead" text-anchor="middle">Plan check</text>
<path d="M641,269 L657,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="662" y="258" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="694.0" y="273" class="bar" text-anchor="middle">Build</text>
<path d="M731,269 L747,269" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="752" y="258" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="784.0" y="273" class="bar" text-anchor="middle">Tests</text>
<circle cx="860" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="860" y="564" class="commit" text-anchor="middle">#43</text>
<text x="860" y="582" class="how" text-anchor="middle">CSV download</text>

<rect x="24" y="320" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="340" r="5" fill="#f0883e"/>
<text x="56" y="345" class="name">Operations</text>
<text x="38" y="365" class="small">“Show the batch status”</text>
<text x="38" y="382" class="who">✓ approves the preview</text>
<rect x="332" y="338" width="394" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="342" y="344" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="374.0" y="359" class="bar" text-anchor="middle">Plan</text>
<path d="M411,355 L427,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="432" y="344" width="104" height="22" rx="6" fill="#211a3a" stroke="#6d5bd0"/>
<text x="484.0" y="359" class="gatehead" text-anchor="middle">Plan check</text>
<path d="M541,355 L557,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="562" y="344" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="594.0" y="359" class="bar" text-anchor="middle">Build</text>
<path d="M631,355 L647,355" stroke="#3d444d" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="652" y="344" width="64" height="22" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="684.0" y="359" class="bar" text-anchor="middle">Tests</text>
<circle cx="760" cy="538" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
<text x="760" y="564" class="commit" text-anchor="middle">#42</text>
<text x="760" y="582" class="how" text-anchor="middle">Batch status</text>

<!-- Sales and Operations change the same file: the board tells both -->
<path d="M694,288 L594,336" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="616" y="322" class="gate" text-anchor="end">same file · the board tells both</text>

<rect x="24" y="406" width="160" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="44" cy="426" r="5" fill="#f0883e"/>
<text x="56" y="431" class="name">Finance</text>
<text x="38" y="451" class="small">“Add a monthly total”</text>
<text x="38" y="468" class="who">✓ approves the preview</text>
<rect x="232" y="424" width="394" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
